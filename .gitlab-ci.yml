# GitLab CI/CD Pipeline for Offline Chat
# =======================================
# Implements semantic versioning with conventional commits

stages:
  - test
  - quality
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  paths:
    - .cache/pip
    - .cache/uv
    - .venv

# =============================================================================
# Test Stage
# =============================================================================

test:
  stage: test
  image: python:3.13
  before_script:
    - pip install uv
    - uv sync --all-extras
  script:
    - uv run pytest -v --tb=short
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:coverage:
  stage: test
  image: python:3.13
  before_script:
    - pip install uv
    - uv sync --all-extras
    - uv pip install pytest-cov
  script:
    - uv run pytest --cov=offline_chat --cov-report=xml --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# Quality Stage
# =============================================================================

lint:
  stage: quality
  image: python:3.13
  before_script:
    - pip install uv
    - uv sync --all-extras
  script:
    - uv run ruff check .
    - uv run ruff format --check .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# Release Stage (Semantic Versioning)
# =============================================================================

release:
  stage: release
  image: node:20
  before_script:
    - npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/gitlab conventional-changelog-conventionalcommits
  script:
    - semantic-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
