[project]
name = "offline-chat"
version = "0.1.0"
description = "Terminal-based chatbot application using local Ollama models"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Offline Chat Contributors"}
]
keywords = ["ollama", "chatbot", "ai", "llm", "rag", "mcp", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "ollama>=0.4.0",
    "ddgs>=7.0.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "mcp>=1.0.0",
    "pytest>=9.0.2",
    "chromadb>=1.4.1",
    "sentence-transformers>=5.2.0",
]

[project.urls]
Homepage = "https://github.com/ultrasardine/offline-chat"
Documentation = "https://github.com/ultrasardine/offline-chat#readme"
Repository = "https://github.com/ultrasardine/offline-chat"
Issues = "https://github.com/ultrasardine/offline-chat/issues"
Changelog = "https://github.com/ultrasardine/offline-chat/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.8.0",
    "commitizen>=4.0.0",
]
oracle = [
    "oracledb>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "property_test: marks tests as property-based tests using hypothesis",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # Ignore line too long errors

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:version",
    "offline_chat/__init__.py:__version__"
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
