[project]
name = "offline-chat-oracle-mcp"
version = "0.1.0"
description = "Oracle Database MCP server plugin for Offline Chat"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "oracledb>=2.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle_mcp_server"]
